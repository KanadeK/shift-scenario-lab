[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shift-scenario-lab"
version = "0.1.0"
description = "Pre-deployment simulations for threshold, feature drift, and class-mix changes."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "KanadeK"}]
dependencies = [
  "numpy>=2.1,<3",
  "plotly>=5.24,<7",
  "polars>=1.16,<3",
  "pydantic>=2.10,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[project.scripts]
shift-scenario = "shift_scenario_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shift_scenario_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["shift_scenario_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
