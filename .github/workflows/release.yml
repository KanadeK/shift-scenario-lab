name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make verify
      - run: make demo
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-release/
      - run: gh release create "$GITHUB_REF_NAME" dist-release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
